# Cloudflare Worker for mod entries. Setup steps are in worker/README.md.
name = "runecraft-bingo-mods"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the Worker from a browser (comma-separated).
ALLOWED_ORIGINS = "https://androiski.github.io,http://localhost:8765"
GITHUB_REPO = "androiski/runecraft-clan-bingo"
# The event window, same as config.json: entries timed outside it are refused.
EVENT_START = "2026-10-16T10:00:00Z"
EVENT_END = "2026-10-19T10:00:00Z"

# Created with `npx wrangler kv namespace create ENTRIES` (see worker/README.md).
[[kv_namespaces]]
binding = "ENTRIES"
id = "fe1f0a63096f4831a800b7b66f8fae82"

# No timers: the event is over and update.yml is switched off. During the event this was
# ["0,15,30,45 * * * *", "1 10 19 10 *"] (board update every 15 min, plus one a minute after
# the end), with "30 * * * *" for the hourly roster check before the start. Times are UTC.
# An empty list removes the schedules on deploy; scheduled() in index.js is kept for next time.
[triggers]
crons = []
